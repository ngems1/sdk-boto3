[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ebs-audit"
dynamic = ["version"]
description = "Find unattached EBS volumes across an AWS Organization, estimate their cost and plan safe deletion."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sebastien Ngembou" }]
requires-python = ">=3.10"
dependencies = ["boto3>=1.28"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Systems Administration",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "moto[ec2,organizations,sts]>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
ebs-audit = "ebs_audit.cli:main"

[tool.hatch.version]
path = "src/ebs_audit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ebs_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["ebs_audit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "C4", "SIM", "RUF", "PTH"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802", "N803"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ebs_audit"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
